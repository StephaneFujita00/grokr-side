<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#fff"/>
  <!-- Side frame top track (10) -->
  <rect x="60" y="90" width="680" height="18" fill="none" stroke="#111" stroke-width="2"/>
  <!-- Side frame bottom track (10) -->
  <rect x="60" y="380" width="680" height="18" fill="none" stroke="#111" stroke-width="2"/>
  <!-- Belt top track (16) -->
  <line x1="80" y1="150" x2="720" y2="150" stroke="#111" stroke-width="4"/>
  <!-- Belt bottom track (18) -->
  <line x1="80" y1="440" x2="720" y2="440" stroke="#111" stroke-width="4"/>
  <!-- Rollers top -->
  <circle cx="95" cy="150" r="16" fill="none" stroke="#111" stroke-width="2"/>
  <circle cx="705" cy="150" r="16" fill="none" stroke="#111" stroke-width="2"/>
  <!-- Rollers bottom -->
  <circle cx="95" cy="440" r="16" fill="none" stroke="#111" stroke-width="2"/>
  <circle cx="705" cy="440" r="16" fill="none" stroke="#111" stroke-width="2"/>
  <!-- Drive motor (12) top -->
  <rect x="660" y="175" width="65" height="42" fill="none" stroke="#111" stroke-width="2"/>
  <!-- Drive motor (14) bottom -->
  <rect x="660" y="465" width="65" height="42" fill="none" stroke="#111" stroke-width="2"/>
  <!-- Redundant motor (30) top -->
  <rect x="580" y="175" width="55" height="35" fill="none" stroke="#111" stroke-width="2"/>
  <!-- Redundant motor (30) bottom -->
  <rect x="580" y="465" width="55" height="35" fill="none" stroke="#111" stroke-width="2"/>
  <!-- Assembly stations (26) top track -->
  <rect x="180" y="105" width="55" height="38" fill="none" stroke="#111" stroke-width="1.5"/>
  <rect x="280" y="105" width="55" height="38" fill="none" stroke="#111" stroke-width="1.5"/>
  <rect x="380" y="105" width="55" height="38" fill="none" stroke="#111" stroke-width="1.5"/>
  <rect x="480" y="105" width="55" height="38" fill="none" stroke="#111" stroke-width="1.5"/>
  <!-- Assembly stations (26) bottom track -->
  <rect x="180" y="395" width="55" height="38" fill="none" stroke="#111" stroke-width="1.5"/>
  <rect x="280" y="395" width="55" height="38" fill="none" stroke="#111" stroke-width="1.5"/>
  <rect x="380" y="395" width="55" height="38" fill="none" stroke="#111" stroke-width="1.5"/>
  <rect x="480" y="395" width="55" height="38" fill="none" stroke="#111" stroke-width="1.5"/>
  <!-- Output (28) top -->
  <rect x="720" y="120" width="35" height="55" fill="none" stroke="#111" stroke-width="2"/>
  <!-- Output (28) bottom -->
  <rect x="720" y="410" width="35" height="55" fill="none" stroke="#111" stroke-width="2"/>
  <!-- Leader lines and labels -->
  <text x="400" y="75" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Track A (16)</text>
  <text x="400" y="365" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Track B (18)</text>
  <text x="692" y="200" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle">Motor (12)</text>
  <text x="692" y="490" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle">Motor (14)</text>
  <text x="607" y="200" font-family="Helvetica, Arial, sans-serif" font-size="8" text-anchor="middle">Redundant (30)</text>
  <text x="607" y="490" font-family="Helvetica, Arial, sans-serif" font-size="8" text-anchor="middle">Redundant (30)</text>
  <text x="207" y="100" font-family="Helvetica, Arial, sans-serif" font-size="8">Station (26)</text>
  <text x="207" y="390" font-family="Helvetica, Arial, sans-serif" font-size="8">Station (26)</text>
  <text x="737" y="150" font-family="Helvetica, Arial, sans-serif" font-size="9">Output (28)</text>
  <text x="737" y="440" font-family="Helvetica, Arial, sans-serif" font-size="9">Output (28)</text>
  <text x="400" y="570" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">FIG. 2</text>
</svg>