<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#fff"/>
  <!-- Main frame (10) top track -->
  <rect x="50" y="120" width="700" height="90" fill="none" stroke="#111" stroke-width="2"/>
  <!-- Main frame (10) bottom track -->
  <rect x="50" y="320" width="700" height="90" fill="none" stroke="#111" stroke-width="2"/>
  <!-- Belt Track A (16) -->
  <line x1="60" y1="165" x2="740" y2="165" stroke="#111" stroke-width="5"/>
  <!-- Belt Track B (18) -->
  <line x1="60" y1="365" x2="740" y2="365" stroke="#111" stroke-width="5"/>
  <!-- Rollers top -->
  <circle cx="75" cy="165" r="14" fill="none" stroke="#111" stroke-width="2"/>
  <circle cx="725" cy="165" r="14" fill="none" stroke="#111" stroke-width="2"/>
  <!-- Rollers bottom -->
  <circle cx="75" cy="365" r="14" fill="none" stroke="#111" stroke-width="2"/>
  <circle cx="725" cy="365" r="14" fill="none" stroke="#111" stroke-width="2"/>
  <!-- Drive motor (12) top -->
  <rect x="680" y="195" width="55" height="35" fill="none" stroke="#111" stroke-width="2"/>
  <!-- Drive motor (14) bottom -->
  <rect x="680" y="395" width="55" height="35" fill="none" stroke="#111" stroke-width="2"/>
  <!-- Redundant motor (30) top -->
  <rect x="620" y="195" width="50" height="30" fill="none" stroke="#111" stroke-width="2"/>
  <!-- Redundant motor (30) bottom -->
  <rect x="620" y="395" width="50" height="30" fill="none" stroke="#111" stroke-width="2"/>
  <!-- Diverter arm (24) -->
  <line x1="110" y1="260" x2="155" y2="300" stroke="#111" stroke-width="4"/>
  <!-- Input chute (22) -->
  <rect x="30" y="250" width="70" height="50" fill="none" stroke="#111" stroke-width="2"/>
  <!-- Ordering terminal (32) -->
  <rect x="20" y="80" width="80" height="45" fill="none" stroke="#111" stroke-width="2"/>
  <!-- Sensors (20) -->
  <circle cx="180" cy="55" r="9" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="180" y1="64" x2="180" y2="120" stroke="#111" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Assembly stations (26) top track -->
  <rect x="220" y="130" width="45" height="28" fill="none" stroke="#111" stroke-width="1.5"/>
  <rect x="320" y="130" width="45" height="28" fill="none" stroke="#111" stroke-width="1.5"/>
  <rect x="420" y="130" width="45" height="28" fill="none" stroke="#111" stroke-width="1.5"/>
  <rect x="520" y="130" width="45" height="28" fill="none" stroke="#111" stroke-width="1.5"/>
  <!-- Assembly stations (26) bottom track -->
  <rect x="220" y="330" width="45" height="28" fill="none" stroke="#111" stroke-width="1.5"/>
  <rect x="320" y="330" width="45" height="28" fill="none" stroke="#111" stroke-width="1.5"/>
  <rect x="420" y="330" width="45" height="28" fill="none" stroke="#111" stroke-width="1.5"/>
  <rect x="520" y="330" width="45" height="28" fill="none" stroke="#111" stroke-width="1.5"/>
  <!-- Output (28) -->
  <rect x="710" y="250" width="55" height="50" fill="none" stroke="#111" stroke-width="2"/>
  <!-- PLC controller (34) -->
  <rect x="300" y="480" width="70" height="40" fill="none" stroke="#111" stroke-width="2"/>
  <!-- Leader lines and labels -->
  <text x="400" y="105" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">Track A (16)</text>
  <text x="400" y="305" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">Track B (18)</text>
  <text x="55" y="280" font-family="Helvetica, Arial, sans-serif" font-size="11">Input (22)</text>
  <text x="55" y="70" font-family="Helvetica, Arial, sans-serif" font-size="10">Ordering (32)</text>
  <text x="180" y="45" font-family="Helvetica, Arial, sans-serif" font-size="10">Sensors (20)</text>
  <text x="707" y="285" font-family="Helvetica, Arial, sans-serif" font-size="11">Output (28)</text>
  <text x="707" y="220" font-family="Helvetica, Arial, sans-serif" font-size="9">Motor (12)</text>
  <text x="707" y="420" font-family="Helvetica, Arial, sans-serif" font-size="9">Motor (14)</text>
  <text x="645" y="220" font-family="Helvetica, Arial, sans-serif" font-size="8">Redundant (30)</text>
  <text x="645" y="420" font-family="Helvetica, Arial, sans-serif" font-size="8">Redundant (30)</text>
  <text x="335" y="505" font-family="Helvetica, Arial, sans-serif" font-size="10">PLC (34)</text>
  <text x="400" y="580" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">FIG. 1</text>
</svg>